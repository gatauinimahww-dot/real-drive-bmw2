
name: Build REAL DRIVE BMW APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: unzip -q source.zip

      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          arguments: -p REAL_DRIVE_ANDROID_PROJECT :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: REAL-DRIVE-BMW-APK
          path: REAL_DRIVE_ANDROID_PROJECT/app/build/outputs/apk/debug/app-debug.apk
          
